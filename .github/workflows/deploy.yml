name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: Build Nuxt
        run: pnpm --dir web install --frozen-lockfile && pnpm --dir web generate

      - name: Deploy Worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN repo secret."
            exit 1
          fi
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "Missing ADMIN_PASSWORD repo secret (Danny's live password)."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID not set; resolving from the API token…"
            CLOUDFLARE_ACCOUNT_ID="$(node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const res = await fetch("https://api.cloudflare.com/client/v4/accounts?per_page=50", {
            headers: { Authorization: "Bearer " + token },
          });
          const body = await res.json();
          if (!body.success) {
            console.error(JSON.stringify(body.errors || body, null, 2));
            console.error("Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions secret (Cloudflare dashboard → Workers → Account ID).");
            process.exit(1);
          }
          const accounts = body.result || [];
          if (accounts.length === 0) {
            console.error("Token sees no accounts. Add CLOUDFLARE_ACCOUNT_ID as a repo secret.");
            process.exit(1);
          }
          if (accounts.length > 1) {
            console.error("Token sees multiple accounts; set CLOUDFLARE_ACCOUNT_ID to one of:");
            for (const a of accounts) console.error("  " + a.id + "  " + a.name);
            process.exit(1);
          }
          process.stdout.write(accounts[0].id);
          JS
          )"
            export CLOUDFLARE_ACCOUNT_ID
            echo "Resolved account ${CLOUDFLARE_ACCOUNT_ID}"
          fi
          npx --yes wrangler@4 deploy
          printf '%s' "$ADMIN_PASSWORD" | npx --yes wrangler@4 secret put ADMIN_PASSWORD

          set -eu
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing CLOUDFLARE_API_TOKEN repo secret."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID not set; resolving from the API token…"
            CLOUDFLARE_ACCOUNT_ID="$(node --input-type=module <<'JS'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const res = await fetch("https://api.cloudflare.com/client/v4/accounts?per_page=50", {
            headers: { Authorization: "Bearer " + token },
          });
          const body = await res.json();
          if (!body.success) {
            console.error(JSON.stringify(body.errors || body, null, 2));
            console.error("Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions secret (Cloudflare dashboard → Workers → Account ID).");
            process.exit(1);
          }
          const accounts = body.result || [];
          if (accounts.length === 0) {
            console.error("Token sees no accounts. Add CLOUDFLARE_ACCOUNT_ID as a repo secret.");
            process.exit(1);
          }
          if (accounts.length > 1) {
            console.error("Token sees multiple accounts; set CLOUDFLARE_ACCOUNT_ID to one of:");
            for (const a of accounts) console.error("  " + a.id + "  " + a.name);
            process.exit(1);
          }
          process.stdout.write(accounts[0].id);
          JS
          )"
            export CLOUDFLARE_ACCOUNT_ID
            echo "Resolved account ${CLOUDFLARE_ACCOUNT_ID}"
          fi
          npx --yes wrangler@4 deploy
